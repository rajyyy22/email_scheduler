name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: reachinbox
          MYSQL_USER: reachinbox_user
          MYSQL_PASSWORD: reachinbox_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: --health-cmd="curl -s http://localhost:9200/_cat/health" --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.5.1

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Generate Prisma Client
        run: pnpm prisma:generate
        env:
          DATABASE_URL: mysql://reachinbox_user:reachinbox_password@localhost:3306/reachinbox

      - name: Run Migrations
        run: pnpm prisma:migrate
        env:
          DATABASE_URL: mysql://reachinbox_user:reachinbox_password@localhost:3306/reachinbox

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Tests
        run: pnpm test
        env:
          DATABASE_URL: mysql://reachinbox_user:reachinbox_password@localhost:3306/reachinbox
          REDIS_URL: redis://localhost:6379
          ELASTICSEARCH_URL: http://localhost:9200
          CREDENTIAL_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

      - name: Build All Packages & Apps
        run: pnpm build
