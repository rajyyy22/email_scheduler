# Redis configuration for ReachInbox Email Scheduler
# Persistence: Append Only File enabled with fsync every second
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Networking & Security
bind 0.0.0.0
protected-mode no
timeout 0
tcp-keepalive 300

# Memory management
maxmemory 512mb
maxmemory-policy noeviction
